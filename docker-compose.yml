# Shared build args (override via .env to route through regional mirrors,
# e.g. DOCKER_BASE_IMAGE=docker.m.daocloud.io/library/python:3.12-slim
# and PIP_INDEX_URL=https://pypi.tuna.tsinghua.edu.cn/simple).
x-build-args: &build-args
  args:
    BASE_IMAGE: ${DOCKER_BASE_IMAGE:-python:3.12-slim}
    PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}

services:
  tradingagents:
    build:
      context: .
      <<: *build-args
    env_file:
      - .env
    volumes:
      - tradingagents_data:/home/appuser/.tradingagents
    tty: true
    stdin_open: true

  # JiYing (即应) bridge: standalone WebSocket service that receives chat
  # messages, runs TradingAgents, and replies with the full report.
  # Requires JIYING_WS_URL / JIYING_APP_ID / JIYING_APP_SECRET in .env.
  jiying-agent:
    build:
      context: .
      <<: *build-args
    entrypoint: ["python", "-m", "jiying"]
    env_file:
      - .env
    volumes:
      - tradingagents_data:/home/appuser/.tradingagents
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    profiles:
      - ollama

  tradingagents-ollama:
    build:
      context: .
      <<: *build-args
    env_file:
      - .env
    environment:
      - TRADINGAGENTS_LLM_PROVIDER=ollama
      - OLLAMA_BASE_URL=http://ollama:11434/v1
    volumes:
      - tradingagents_data:/home/appuser/.tradingagents
    depends_on:
      - ollama
    tty: true
    stdin_open: true
    profiles:
      - ollama

  # JiYing bridge variant backed by the local Ollama instance.
  jiying-agent-ollama:
    build:
      context: .
      <<: *build-args
    entrypoint: ["python", "-m", "jiying"]
    env_file:
      - .env
    environment:
      - TRADINGAGENTS_LLM_PROVIDER=ollama
      - OLLAMA_BASE_URL=http://ollama:11434/v1
    volumes:
      - tradingagents_data:/home/appuser/.tradingagents
    depends_on:
      - ollama
    restart: unless-stopped
    profiles:
      - ollama

volumes:
  tradingagents_data:
  ollama_data:
